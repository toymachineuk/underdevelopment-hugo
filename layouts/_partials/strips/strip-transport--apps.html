
<!-- =====================================
     GETTING AROUND APPS
===================================== -->

<section class="tv-feature-section tv-apps-section section-lg width-1200">




  <!-- UNIVERSAL APP LAYOUT -->

  <div class="tv-apps-layout">

    <!-- HEADER -->

    <div class="tv-apps-intro">

      <span class="text-label">Explore the city</span>

      <h2 class="title-xxs">
        Get around with these apps.
      </h2>

    </div>


    <!-- APPS -->

    <div class="tv-apps-carousel">

      <!-- COMAPS -->

      <article class="tv-app-item">

        <a
          class="tv-app-badge"
          href="https://www.comaps.app/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit CoMaps"
        >
          <span class="tv-app-logo">
            <img
              src="/icons/apps/comaps.png"
              alt="CoMaps logo"
              loading="lazy"
            >
          </span>
        </a>

        <div class="tv-app-description">
          <h3>CoMaps</h3>
          <p>
            Explore Tbilisi and Georgia with free
            offline maps and navigation.
          </p>
        </div>

      </article>


      <!-- OSMAND -->

      <article class="tv-app-item">

        <a
          class="tv-app-badge"
          href="https://osmand.net/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit OsmAnd"
        >
          <span class="tv-app-logo">
            <img
              src="/icons/apps/osmand.png"
              alt="OsmAnd logo"
              loading="lazy"
            >
          </span>
        </a>

        <div class="tv-app-description">
          <h3>OsmAnd</h3>
          <p>
            Plan detailed routes and discover hiking
            trails with offline maps.
          </p>
        </div>

      </article>


      <!-- ORGANIC MAPS -->

      <article class="tv-app-item">

        <a
          class="tv-app-badge"
          href="https://organicmaps.app/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Organic Maps"
        >
          <span class="tv-app-logo">
            <img
              src="/icons/apps/organicmaps.png"
              alt="Organic Maps logo"
              loading="lazy"
            >
          </span>
        </a>

        <div class="tv-app-description">
          <h3>Organic Maps</h3>
          <p>
            Find places and navigate offline with a
            simple, privacy-focused map.
          </p>
        </div>

      </article>

    </div>

  </div>

</section>
