<!-- =========================================
     UNIVERSAL DISTRICT MODAL
========================================= -->

<div
  id="district-modal"
  class="tv-district-modal"
  aria-hidden="true"
>
  <div
    class="tv-district-modal__overlay"
    data-district-close
  ></div>

  <section
    class="tv-district-modal__panel"
    role="dialog"
    aria-modal="true"
    aria-label="District guide"
    tabindex="-1"
  >
    <button
      type="button"
      class="tv-district-modal__close"
      aria-label="Close district guide"
      data-district-close
    >
      &times;
    </button>

    <div
      class="tv-district-modal__content"
      id="district-modal-content"
    ></div>
  </section>
</div>
